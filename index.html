<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-white text-slate-600 font-sans min-h-screen">

    <div id="app"></div>

                location: "Westerstede, Germany",
                skillsTitle: "Services",

                why1Title: "Confidentiality",
                why1Desc: "Sensitive information is handled with the discretion IT security matters demand — as a matter of course.",
                why2Title: "Own security lab",
                why2Desc: "Suricata, Zeek, and network monitoring in active use in a self-run lab — not just theory.",
                why3Title: "Flexible & project-based",
                why3Desc: "Engagements sized to what you need, without long-term commitment — well suited to a single expert report or a clearly scoped project.",

                footerImpressum: "Impressum",

        };

        const sectionIds = ['home', 'skills', 'why', 'contact'];
        let currentLang = 'de';

        // --- GLOBAL FUNCTIONS ---
        function toggleLang() {
            currentLang = currentLang === 'en' ? 'de' : 'en';
            renderApp();
        }

        function scrollToSection(id) {
            const element = document.getElementById(id);
            if (element) {
                element.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function updateScrollSpy() {
            const scrollPosition = window.scrollY + 100;
            let currentActive = 'home';

            for (const section of sectionIds) {
                const element = document.getElementById(section);
                if (element && scrollPosition >= element.offsetTop && scrollPosition < element.offsetTop + element.offsetHeight) {
                    currentActive = section;
                }
            }

            // Update nav classes
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.getAttribute('data-section') === currentActive) {
                    btn.classList.add('nav-active');
                    btn.classList.remove('text-slate-500');
                } else {
                    btn.classList.remove('nav-active');
                    btn.classList.add('text-slate-500');
                }
            });
        }

        // Add scroll listener
        window.addEventListener('scroll', updateScrollSpy);

        // --- RENDER FUNCTION ---
        function renderApp() {
            const t = translations[currentLang];
            const app = document.getElementById('app');

            app.innerHTML = `
                <nav class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">

                        <div class="flex items-center justify-between h-16">
                            <div class="flex-shrink-0 font-bold text-xl tracking-tighter text-slate-900 flex items-center gap-2">
                                <i data-lucide="shield" class="w-5 h-5 text-blue-600"></i>
                                <span>ITSEC<span class="text-blue-600">.</span>NORDWEST</span>
                            </div>

                            <div class="hidden md:flex items-center space-x-8">

                                        ${item}
                                    </button>
                                `).join('')}
                            </div>

                            <div class="flex items-center">
                                <button onclick="toggleLang()" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-white border border-slate-300 hover:border-blue-400 hover:text-blue-600 text-sm text-slate-600 transition-all" title="Toggle Language">

                                </button>
                            </div>
                        </div>
                    </div>
                </nav>

                        <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[700px] h-[700px] bg-blue-200/30 rounded-full blur-[120px] pointer-events-none"></div>

                        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 w-full py-20">

                                ${t.heroBadge}
                            </div>

                            <h1 class="text-5xl md:text-7xl font-extrabold text-slate-900 tracking-tight mb-6 max-w-4xl">
                                ${t.heroTitlePre}<span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-600">${t.heroTitleAccent}</span>
                            </h1>

                            <p class="text-xl md:text-2xl font-light text-slate-600 mb-6 max-w-3xl leading-relaxed">
                                ${t.heroDesc}

                            </a>

                                <i data-lucide="linkedin" class="w-5 h-5"></i> ${t.profileLi}
                            </a>
                        </div>
                        <p class="text-slate-400 text-sm">
                            © ${new Date().getFullYear()} ITSEC NORDWEST — Ron Ebken. ${t.rights}
                        </p>
                        <div class="mt-4 flex items-center justify-center gap-4 text-xs text-slate-400">
                            <a href="impressum.html" class="hover:text-blue-600 transition-colors">${t.footerImpressum}</a>
                            <span>·</span>
                            <a href="datenschutz.html" class="hover:text-blue-600 transition-colors">${t.footerPrivacy}</a>
                        </div>
                    </div>
                </footer>
            `;

            // Tell Lucide to render the SVG icons based on the data-lucide attributes injected
            lucide.createIcons();

            // Re-apply scroll spy styling after render
            updateScrollSpy();
        }

        // Initialize application on page load
        renderApp();
    </script>
</body>
</html>
